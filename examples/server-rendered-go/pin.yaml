# A server-rendered Go app: htmx for partials, a CSS kit, an icon set.
# The honest dependency count is three; pin fetches exactly those
# files and writes them under internal/web/static/vendor so the Go
# http.FileServer serves them straight.
out: "internal/web/static/vendor"

assets:
  - name: "htmx.org"
    version: "^2.0"
    files: ["dist/htmx.min.js"]

  - name: "@tailwindcss/browser"
    version: "^4.1"

  - name: "lucide"
    version: "^0.545"
    files: ["dist/umd/lucide.min.js"]
