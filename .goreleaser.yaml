version: 2

project_name: pin

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/pin
    binary: pin
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w
      - -X github.com/git-pkgs/pin/internal/cli.version={{.Version}}
      - -X github.com/git-pkgs/pin.ToolVersion={{.Version}}

archives:
  - formats: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"

sboms:
  - artifacts: archive

signs:
  - cmd: cosign
    signature: "${artifact}.cosign.bundle"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: git-pkgs
    name: pin
  draft: false
  prerelease: auto

homebrew_casks:
  - name: pin
    description: Browser asset vendoring without npm
    homepage: https://github.com/git-pkgs/pin
    repository:
      owner: git-pkgs
      name: homebrew-git-pkgs
    directory: Casks
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
